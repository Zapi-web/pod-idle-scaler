apiVersion: finops.zapi-web.github.io/v1alpha1
kind: IdleScaler
metadata:
  name: my-api-idler
spec:
  scaleTargetRef:
    kind: Deployment
    name: my-api
  idleTimeout: 15m
  checkTimeout: 1m
  scaleMinimum: 0
  trigger:
    type: HTTP
    http:
      url: https://my-api.example.com/healthz
      expectedCode: 200