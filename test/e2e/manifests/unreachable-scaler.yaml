apiVersion: finops.zapi-web.github.io/v1alpha1
kind: IdleScaler
metadata:
  name: e2e-unreachable-trigger
  namespace: k8s-operator-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: e2e-test-app
  scaleMinimum: 1
  checkTimeout: 1s
  idleTimeout: 5s
  trigger:
    type: HTTP
    http:
      url: http://127.0.0.1:1/
      timeout: 1s