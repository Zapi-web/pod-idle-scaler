apiVersion: finops.zapi-web.github.io/v1alpha1
kind: IdleScaler
metadata:
  name: e2e-test-scaler
  namespace: k8s-operator-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: e2e-test-app
  scaleMinimum: 1
  idleTimeout: 2s
  checkTimeout: 1s
  trigger:
    type: HTTP
    http:
      url: http://trigger-server.k8s-operator-system.svc.cluster.local/idle
      timeout: 1s