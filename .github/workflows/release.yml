name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure full semver tag (vX.Y.Z)
        run: |
          if ! [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must be full semver, e.g. v1.2.3 (got: ${{ github.ref_name }})"
            exit 1
          fi
  tests:
    uses: ./.github/workflows/test.yml
  linting:
    uses: ./.github/workflows/lint.yml
  docker:
    needs: [ validate, tests, linting ]
    uses: ./.github/workflows/docker.yml

  release:
    needs: [ validate, docker ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install Kustomize
        run: |
          make kustomize

      - name: Build install.yaml with release image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          make build-installer IMG="ghcr.io/${REPO_LOWER}:${{ github.ref_name }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/install.yaml
          generate_release_notes: true